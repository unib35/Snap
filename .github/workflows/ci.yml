name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install mise and Tuist
        uses: jdx/mise-action@v2

      - name: Verify Tuist
        run: tuist version

      - name: Generate Project
        run: tuist generate --no-open

      - name: Build iOS App
        run: |
          xcodebuild build \
            -workspace Snap.xcworkspace \
            -scheme App \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  build-macos:
    name: Build macOS App
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install mise and Tuist
        uses: jdx/mise-action@v2

      - name: Verify Tuist
        run: tuist version

      - name: Generate Project
        run: tuist generate --no-open

      - name: Build macOS App
        run: |
          xcodebuild build \
            -workspace Snap.xcworkspace \
            -scheme MacReceiver \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  test:
    name: Run Tests
    runs-on: macos-15
    needs: [build-ios]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install mise and Tuist
        uses: jdx/mise-action@v2

      - name: Verify Tuist
        run: tuist version

      - name: Generate Project
        run: tuist generate --no-open

      - name: Run Tests
        run: |
          xcodebuild test \
            -workspace Snap.xcworkspace \
            -scheme App \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            | xcpretty
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
